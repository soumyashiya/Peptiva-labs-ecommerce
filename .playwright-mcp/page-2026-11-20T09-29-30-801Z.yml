      - heading "What is Creatine?" [level=3] [ref=f7e1062] [cursor=pointer]
      - generic [ref=f7e1068]:
        - paragraph [ref=f7e1069]:
          - text: Creatine is a naturally occurring, nitrogen containing compound made from amino acids - arginine, glycine and methionine
          - superscript [ref=f7e1070]: "5"
          - text: . It plays a key role in how the body produces energy, as it helps regenerate ATP, which is a key energy molecule within cells6. The form used in Pro Creatine – creatine monohydrate, is the most researched and widely trusted form because it’s stable, effective, and closely matches the body’s natural creatine stores.
        - paragraph [ref=f7e1071]:
          - text: Although small amounts of creatine can be found in foods like meat and fish, most of the body’s creatine is stored in our muscles. In fact, around 95% is held in skeletal muscle
          - superscript [ref=f7e1072]: "5"
          - text: ", which is why creatine is so closely linked to supporting muscular strength, energy and performance. The remaining 5% is stored in organs that require fast, high energy output, such as the heart and brain"
          - superscript [ref=f7e1073]: "5"
          - text: ", highlighting its importance beyond just exercise."
        - list [ref=f7e1074]:
          - listitem [ref=f7e1075]:
            - button "Is it safe? " [ref=f7e1076] [cursor=pointer]
        - list [ref=f7e1077]:
          - listitem [ref=f7e1078]:
            - button "Why it’s important for vegetarians or vegans? " [ref=f7e1079] [cursor=pointer]
        - generic [ref=f7e1080] [cursor=pointer]
      - heading "Why is Creatine so important for Women?" [level=3] [ref=f7e1082] [cursor=pointer]
      - generic [ref=f7e1088]:
        - text: Creatine has traditionally been associated with men, largely due to its role in supporting energy production and facilitating increases in muscle mass. However, more women are now incorporating creatine into their daily diets due to the array of health benefits it offers throughout the entire female hormone lifecycle
        - superscript [ref=f7e1089]: "7"
        - text: . Not to mention, that physiologically, women naturally have approximately 70–80% lower endogenous creatine stores compared to males
        - superscript [ref=f7e1090]: "7"
        - text: ", which is why it’s even more important that females are consistent with regular creatine intake. For many females new to creatine, there may be initial concerns surrounding the so-called ‘myths’ of potential weight gain or the impact on fertility. However, there is no research to suggest that creatine results in body-fat storage, instead muscles become more fuller helping women look subtly more defined, without the weight gain. There is also no conclusive evidence to suggest that creatine negatively impacts fertility, contraception, hormone levels or menstrual cycles; all the research highlights the opposite, showcasing only positive benefits"
        - superscript [ref=f7e1091]: "7"
        - text: .
        - list [ref=f7e1092]:
          - listitem [ref=f7e1093]:
            - button "Hormone lifecycle " [ref=f7e1094] [cursor=pointer]
        - list [ref=f7e1095]:
          - listitem [ref=f7e1096]:
            - button "Menopause " [ref=f7e1097] [cursor=pointer]
