    - generic [ref=f7e698]:
      - heading "Myths about Creatine" [level=3] [ref=f7e700] [cursor=pointer]
      - list [ref=f7e707]:
        - listitem [ref=f7e708]:
          - generic [ref=f7e709]: "1."
          - generic [ref=f7e710]:
            - paragraph [ref=f7e711]: "MYTH: Creatine will make me bulky"
            - paragraph [ref=f7e712]: "TRUTH: More definition. Not more size. Creatine does not cause fat gain. Building significant muscle bulk requires years of progressive heavy lifting combined with a sustained caloric surplus - creatine alone cannot produce this. Women don't have the testosterone physiology to bulk easily regardless."
            - paragraph [ref=f7e713]: What creatine does is help your muscles work harder, recover faster, and appear more defined. Any initial scale increase in weeks 1–2 is intracellular water - your muscle cells hydrating and becoming more functional. It is not fat. Most women describe looking more toned, not bigger, within 4–6 weeks.
        - listitem [ref=f7e714]:
          - generic [ref=f7e715]: "2."
          - generic [ref=f7e716]:
            - paragraph [ref=f7e717]: "MYTH: I need to go to the gym every day for it to work"
            - paragraph [ref=f7e718]: "TRUTH: You do not need to exercise for creatine to matter. Creatine is not dependent on exercise. Creatine is often misunderstood as a workout supplement, but its role goes far beyond exercise. It helps support cellular energy, cognitive function, muscle maintenance, and healthy ageing. Daily use matters more than training status."
        - listitem [ref=f7e719]:
          - generic [ref=f7e720]: "3."
          - generic [ref=f7e721]:
            - paragraph [ref=f7e722]: "MYTH: Creatine will disrupt my hormones or affect my fertility"
            - paragraph [ref=f7e723]: "TRUTH: There is no evidence for this. The research shows the opposite. Creatine does not alter, disrupt, or regulate hormone levels, and there is no clinical evidence it negatively impacts menstrual cycle, fertility, or contraception. The research consistently shows creatine acts as a supportive energy reserve during hormonal fluctuations, improving function rather than impairing it. Vitamin B6 in this formula actively supports oestrogen metabolism, contributing to hormonal balance rather than disrupting it."
        - listitem [ref=f7e724]:
          - generic [ref=f7e725]: "4."
          - generic [ref=f7e726]:
            - paragraph [ref=f7e727]: "MYTH: Creatine is only for athletes and it won't do anything for me"
            - paragraph [ref=f7e728]: "TRUTH: Creatine is a daily essential. Not a sports supplement. The clinical evidence extends far beyond athletic performance. Published research demonstrates meaningful benefits for: cognitive function and memory, mood and depression support, bone mineral density, hormonal resilience, healthy ageing, and muscle preservation during menopause. You do not need to be an athlete to benefit. You need a functioning brain, consistent energy, strong bones, and stable hormones. That describes every woman."
        - listitem [ref=f7e729]:
          - generic [ref=f7e730]: "5."
          - generic [ref=f7e731]:
            - paragraph [ref=f7e732]: "MYTH: It will cause bloating and water retention"
            - paragraph [ref=f7e733]: "TRUTH: Are you a body-builder? The bloating historically associated with creatine was caused by old-school loading protocols: 20–25g/day for 5–7 consecutive days. Those protocols are no longer recommended. Feel Pro Creatine uses a daily maintenance dose of 5g as the evidence-based approach that achieves full muscle saturation within 3–4 weeks without the GI discomfort or water retention associated with loading."
