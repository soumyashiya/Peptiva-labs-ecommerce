    - generic [ref=f7e782]:
      - heading "Health improvement timeline" [level=3] [ref=f7e784] [cursor=pointer]
      - generic [ref=f7e790]:
        - generic [ref=f7e792]:
          - generic [ref=f7e793]:
            - heading "Before 1 month" [level=3] [ref=f7e794]
            - generic [ref=f7e795]:
              - paragraph [ref=f7e799]: Energy
              - paragraph [ref=f7e803]: Nutrient breakdown
            - paragraph [ref=f7e805]: Some women may have naturally greater phosphocreatine levels than others based on age, hormonal status, diet and genetics, so immediate results may differ between individuals. That being said, when taking 5g of creatine daily for 3-4 weeks, regardless of prior creatine levels, you should start to feel an improvement in energy levels due to the instant energy surge it provides. Vitamin B6 within our formula is quickly metabolised, yet quite quickly excreted, which is why it takes about a week to slowly build up within the body. Within the first month, vitamin B6 will start to support the body with a more efficient metabolism of fats, sugars and protein for greater nutrient breakdown and energy creation.
          - generic [ref=f7e806]:
            - heading "1 month and after" [level=3] [ref=f7e807]
            - generic [ref=f7e808]:
              - paragraph [ref=f7e812]: Energy
              - paragraph [ref=f7e816]: Hormone support
              - paragraph [ref=f7e820]: Cognition
            - paragraph [ref=f7e822]: Creatine levels should now be higher in the muscles and daily intake will ensure levels are maintained. Vitamin B6 also plays a role in hormone regulation and oestrogen-progesterone balance which in turn can help with stabilising mood, especially during PMS. Creatine will continue to support psychological function too, so you may notice less ‘brain fog’ and less mental exhaustion due to the replenishment of ATP in the brain.
          - generic [ref=f7e823]:
            - heading "3 months and after" [level=3] [ref=f7e824]
            - generic [ref=f7e825]:
              - paragraph [ref=f7e829]: Muscle & bone health
              - paragraph [ref=f7e833]: Energy
              - paragraph [ref=f7e837]: Hormone support
            - paragraph [ref=f7e839]: After 3 months, you may begin to notice muscles feeling fuller and firmer. If creatine is combined with resistance training, there will be greater muscle strength, and you may notice physical changes to your overall body composition with lean muscle mass -vitally important for women entering the menopause. While physical performance is improving, so is cognitive performance. Vitamin B6 will work to improve mood caused by hormonal imbalances and there may even be other hormone related benefits such as less menstrual fatigue. Creatine stores will also be working efficiently for better processing speed and memory function. As Vitamin D and K are both fat soluble, consistent intake over several months will see blood levels of these nutrients rise to slowly support overall bone and muscle health.
          - generic [ref=f7e840]:
            - heading "1 year and after" [level=3] [ref=f7e841]
            - generic [ref=f7e842]:
              - paragraph [ref=f7e846]: Muscle strength
              - paragraph [ref=f7e850]: Physical & cognitive performance
              - paragraph [ref=f7e854]: Overall wellbeing
            - paragraph [ref=f7e856]: At one year women of all ages and lifecycle should have a greater feeling of overall wellness. Creatine and the supporting vitamins work together to provide positive physical benefits such as sustained energy levels, reduced fatigue, improved lean muscle mass and stronger bones. However, as neurotransmitter and hormone pathways rebalance you should have improved cognitive function with less mental fatigue and a greater feeling of clarity, memory and information processing speed.
