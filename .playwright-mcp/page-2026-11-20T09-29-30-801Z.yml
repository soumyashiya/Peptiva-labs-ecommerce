      - heading "Benefits" [level=3] [ref=f7e909] [cursor=pointer]
      - generic [ref=f7e915]:
        - list [ref=f7e916]:
          - listitem [ref=f7e917]:
            - paragraph [ref=f7e918]: Energy production
            - paragraph [ref=f7e919]:
              - text: Pro Creatine delivers 5000 mg of high potency creatine, which works by increasing phosphocreatine stores in your muscles
              - superscript [ref=f7e920]: "5"
              - text: . These stores help regenerate ATP — the body’s primary energy source — allowing your cells to produce energy more efficiently
              - superscript [ref=f7e921]: "12"
              - text: . Creatine is one of the most widely researched supplements, with studies consistently showing its ability to enhance training capacity, support short bursts of high-intensity effort
              - superscript [ref=f7e922]: "13"
              - text: ", increase strength, improve muscular endurance, and delay fatigue"
              - superscript [ref=f7e923]: "14"
              - text: .
            - paragraph [ref=f7e924]:
              - text: In our formula, creatine is also combined with Vitamin B6, an essential nutrient that supports energy metabolism and helps reduce tiredness and fatigue
              - superscript [ref=f7e925]: "15"
              - text: . Together, these ingredients work to maximise energy output.
          - listitem [ref=f7e926]:
            - paragraph [ref=f7e927]: Hormone support
            - paragraph [ref=f7e928]:
              - text: Vitamin B6 has been included in Pro Creatine as it is one of the most dominant vitamins in regulating hormonal activity
              - superscript [ref=f7e929]: "2"
              - text: "; it is involved in the metabolism of oestrogen in the liver, which is essential for women of a reproductive age, as it can help maintain health oestrogen: progesterone balance and potentially reduces PMS symptoms"
              - superscript [ref=f7e930]: "16"
              - text: .
            - paragraph [ref=f7e931]:
              - text: Synergistically, creatine can further support hormonal health by supporting energy production during times of hormonal fluctuation experienced during regular menstrual cycle, peri-menopause, menopause and post-menopause. As creatine acts as an energy reserve it can help reduce fatigue, maintain cognitive function and mood stability when hormones levels dip
              - superscript [ref=f7e932]: "7"
              - text: .
          - listitem [ref=f7e933]:
            - paragraph [ref=f7e934]: Metabolic health
            - paragraph [ref=f7e935]:
              - text: Creatine also helps support the maintenance of lean muscle mass — a key component of metabolic health. This is especially important for menopausal women, who naturally experience greater muscle loss and the reason why science encourages menopausal women to combine weight training with creatine for even greater results in muscle preservation
              - superscript [ref=f7e936]: "12"
              - text: .
            - paragraph [ref=f7e937]:
              - text: While Vitamin B6 does not directly build muscle, it plays an essential role in many processes that enable muscle growth
              - superscript [ref=f7e938]: "14"
              - text: . This is why it has been intentionally included in this formula; vitamin B6 is crucial for the metabolism of protein, carbohydrates, and fats, and some evidence indicates that its role in increasing lipid oxidation and energy expenditure can enhance fat burning for better body composition and overall health
              - superscript [ref=f7e939]: "14"
              - text: .
          - listitem [ref=f7e940]:
            - paragraph [ref=f7e941]: Bone and muscle strength
            - paragraph [ref=f7e942]:
              - text: Vitamin D and vitamin K are essential partners in supporting women’s long-term bone and muscle health. Vitamin D enhances calcium absorption, ensuring the body has the raw materials needed for strong bones
              - superscript [ref=f7e943]: "17"
              - text: ", while vitamin K directs that calcium into the bone matrix, improving mineralisation, remodelling, and overall skeletal strength."
            - paragraph [ref=f7e944]:
              - text: They have been included alongside creatine, as together, they form a critical foundation for women, especially during menopause, when bone density naturally declines and muscle strength becomes harder to maintain
              - superscript [ref=f7e945]: "18"
              - text: .
          - listitem [ref=f7e946]:
            - paragraph [ref=f7e947]: Cognitive benefit
            - paragraph [ref=f7e948]:
              - text: This research is still developing, but early evidence suggests that creatine may help support the brain’s energy production pathways. The brain is one of the body’s largest consumers of ATP, and — as mentioned earlier—a small amount of creatine is stored in the brain as well. This stored creatine can help supply the energy needed for thinking, learning, memory recall, and reducing mental fatigue
              - superscript [ref=f7e949]: "19"
              - text: . Women are particularly prone to experiencing “brain fog” or memory lapses, often linked to hormonal fluctuations and low oestrogen levels, especially during luteal phase and menopause.
            - paragraph [ref=f7e950]:
              - text: Because of this, Pro Creatine may offer benefits beyond physical performance, supporting overall brain health as well. Early findings have shown improvements in women’s short-term memory and enhanced cognitive performance during periods of stress
              - superscript [ref=f7e951]: "19"
              - text: . The inclusion of Vitamin B6 further supports psychological function
              - superscript [ref=f7e952]: "4"
              - text: due to its involvement in neurotransmitter production, energy metabolism and brain development
              - superscript [ref=f7e953]: "14"
              - text: .
        - generic [ref=f7e954] [cursor=pointer]
