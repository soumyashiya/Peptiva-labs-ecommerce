          - generic [ref=f31e35]: Policy
          - generic [ref=f31e36]: Last updated August 3, 2026
        - heading "Privacy Policy" [level=1] [ref=f31e37]
        - paragraph [ref=f31e38]: This policy explains what personal information Peptiva Labs collects when you use our site or place an order, and how we use, store and protect it.
      - group [ref=f31e39]:
        - generic "On this page" [ref=f31e40] [cursor=pointer]
      - generic [ref=f31e45]:
        - generic [ref=f31e49]:
          - heading "Scope" [level=2] [ref=f31e50]
          - paragraph [ref=f31e52]: This policy applies to peptivalabs.com and any related checkout, account, or order-tracking pages. By using the site or placing an order, you agree to the collection and use of information as described here.
        - generic [ref=f31e56]:
          - heading "Information we collect" [level=2] [ref=f31e57]
          - list [ref=f31e59]:
            - listitem [ref=f31e60]: "Account details: name, email address, and password (stored as a salted hash, never in plain text)."
            - listitem [ref=f31e61]: "Order information: shipping address, items purchased, order value, and order/tracking status."
            - listitem [ref=f31e62]: "Payment information: handled entirely by our payment processor — we do not store full card numbers on our servers."
            - listitem [ref=f31e63]: "Communications: messages you send us via email, chat widget, or the newsletter sign-up form."
            - listitem [ref=f31e64]: "Technical data: IP address, browser type, and pages visited, collected automatically for security and analytics."
        - generic [ref=f31e68]:
          - heading "How we use it" [level=2] [ref=f31e69]
          - list [ref=f31e71]:
            - listitem [ref=f31e72]: To process, ship, and provide support for your orders.
            - listitem [ref=f31e73]: To create and secure your account and order-history access.
            - listitem [ref=f31e74]: To send order confirmations, shipping updates, and — only if you opt in — newsletter emails.
            - listitem [ref=f31e75]: To detect fraud, abuse, and security issues across the site.
            - listitem [ref=f31e76]: To improve site performance and the products we offer.
        - generic [ref=f31e80]:
          - heading "Cookies" [level=2] [ref=f31e81]
          - paragraph [ref=f31e83]: We use essential cookies to keep you signed in and to remember the contents of your cart between visits. We may also use limited analytics cookies to understand how the site is used in aggregate. You can block or delete cookies in your browser settings, though some features — like staying signed in or a persistent cart — may stop working correctly if you do.
        - generic [ref=f31e87]:
          - heading "Sharing with third parties" [level=2] [ref=f31e88]
          - generic [ref=f31e89]:
            - paragraph [ref=f31e90]: "We only share personal information with the third parties needed to run the business, including:"
            - list [ref=f31e91]:
              - listitem [ref=f31e92]: Payment processors, to complete and secure transactions.
              - listitem [ref=f31e93]: Shipping carriers, to deliver your order and provide tracking.
              - listitem [ref=f31e94]: Email and chat-support providers, to send transactional messages and respond to enquiries.
            - paragraph [ref=f31e95]: We do not sell personal information to third parties.
        - generic [ref=f31e99]:
          - heading "Data retention" [level=2] [ref=f31e100]
          - paragraph [ref=f31e102]: We keep account and order records for as long as your account is active and for a reasonable period afterward to satisfy accounting, tax, and fraud-prevention obligations. You can request deletion of your account data at any time, subject to those legal requirements.
        - generic [ref=f31e106]:
          - heading "Your rights" [level=2] [ref=f31e107]
          - generic [ref=f31e108]:
            - paragraph [ref=f31e109]: "Depending on where you live, you may have the right to:"
            - list [ref=f31e110]:
              - listitem [ref=f31e111]: Request a copy of the personal information we hold about you.
              - listitem [ref=f31e112]: Correct inaccurate information.
              - listitem [ref=f31e113]: Request deletion of your account and associated data.
              - listitem [ref=f31e114]: Opt out of marketing emails at any time via the unsubscribe link.
            - paragraph [ref=f31e115]:
              - text: To exercise any of these rights, email
              - link "sales@peptivalabs.com" [ref=f31e116] [cursor=pointer]:
                - /url: mailto:sales@peptivalabs.com
              - text: .
        - generic [ref=f31e120]:
          - heading "Children's privacy" [level=2] [ref=f31e121]
          - paragraph [ref=f31e123]: Our products and site are intended for use by qualified research professionals aged 18 and over. We do not knowingly collect personal information from anyone under 18.
        - generic [ref=f31e127]:
          - heading "Changes to this policy" [level=2] [ref=f31e128]
          - paragraph [ref=f31e130]: We may update this policy from time to time. Material changes will be reflected by an updated “last updated” date at the top of this page.
        - generic [ref=f31e134]:
          - heading "Contact us" [level=2] [ref=f31e135]
